name: Supabase Automatic Backup to Google Drive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run pg_dump from Supabase
        run: |
          mkdir -p backups
          TIMESTAMP=\$(date +'%Y-%m-%d_%H-%M-%S')
          pg_dump --dbname="${{ secrets.SUPABASE_DB_URL }}" -f "backups/supabase_backup_${TIMESTAMP}.sql"
          gzip "backups/supabase_backup_\${TIMESTAMP}.sql"

      - name: Upload to Google Drive using Node.js
        env:
          GDRIVE_CREDENTIALS: \${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: \${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          node -e '
            const { google } = require("googleapis");
            const fs = require("fs");

            async function uploadFile() {
              const credentials = JSON.parse(process.env.GDRIVE_CREDENTIALS);
              const auth = new google.auth.GoogleAuth({
                credentials,
                scopes: ["https://www.googleapis.com/auth/drive.file"],
              });

              const drive = google.drive({ version: "v3", auth });
              
              const files = fs.readdirSync("backups");
              const targetFile = files.find(f => f.endsWith(".sql.gz"));
              if (!targetFile) throw new Error("Backup file not found!");
              
              const filePath = `backups/${targetFile}`;

              const fileMetadata = {
                name: targetFile,
                parents: [process.env.GDRIVE_FOLDER_ID],
              };
              const media = {
                mimeType: "application/gzip",
                body: fs.createReadStream(filePath),
              };

              const response = await drive.files.create({
                resource: fileMetadata,
                media: media,
                fields: "id",
              });
              console.log("File uploaded successfully, ID:", response.data.id);
            }

            uploadFile().catch(err => {
              console.error(err);
              process.exit(1);
            });
          '
