name: Supabase Automatic Backup to Google Drive

on:
  schedule:
    # Berjalan otomatis setiap hari pukul 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch: # Tombol untuk menjalankan backup secara manual

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create Backup File Name with Timestamp
        id: timestamp
        run: echo "TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

      - name: Run pg_dump from Supabase
        run: |
          mkdir -p backups
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" -f backups/supabase_backup_${{ env.TIMESTAMP }}.sql
          gzip backups/supabase_backup_${{ env.TIMESTAMP }}.sql

      - name: Upload Backup to Google Drive
        uses: adityak20/gdrive-upload-action@v0.1.2
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: backups/supabase_backup_${{ env.TIMESTAMP }}.sql.gz
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          overwrite: false
